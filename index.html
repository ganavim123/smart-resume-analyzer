<!DOCTYPE html>
<html>

<head>
    <title>AI Smart Resume Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Smart Resume Analyzer</h1>

        <form>

            <label>Upload Resume</label>

            <input type="file" accept=".pdf">

            <label>Enter Job Description</label>

            <textarea
                rows="8"
                placeholder="Enter Job Description">
            </textarea>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

        <div class="result">

            <h2>Resume Score</h2>

            <div class="score-box">
                85%
            </div>

            <h3>Matched Skills</h3>

            <ul>
                <li>Python</li>
                <li>HTML</li>
                <li>CSS</li>
                <li>SQL</li>
            </ul>

            <h3>Missing Skills</h3>

            <ul>
                <li>React</li>
                <li>AWS</li>
            </ul>

        </div>

    </div>

</body>

</html>
